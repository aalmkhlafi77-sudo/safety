name: Windows Tauri Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Windows native packages
        shell: pwsh
        run: |
          $rollupVersion = node -p "require('./node_modules/rollup/package.json').version"
          $lightningVersion = node -p "require('./node_modules/lightningcss/package.json').version"
          $oxideVersion = node -p "require('./node_modules/@tailwindcss/oxide/package.json').version"

          npm install --no-save `
            "@rollup/rollup-win32-x64-msvc@$rollupVersion" `
            "lightningcss-win32-x64-msvc@$lightningVersion" `
            "@tailwindcss/oxide-win32-x64-msvc@$oxideVersion"

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows application
        run: npm run tauri build

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMAN-Windows-v2.0.0
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
