<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Vault Outer Body -->
  <rect x="10" y="10" width="80" height="80" rx="16" fill="url(#metalGrad)" stroke="#64748b" stroke-width="3" />
  <!-- Bolts / Rivets -->
  <circle cx="20" cy="20" r="3" fill="#94a3b8" />
  <circle cx="80" cy="20" r="3" fill="#94a3b8" />
  <circle cx="20" cy="80" r="3" fill="#94a3b8" />
  <circle cx="80" cy="80" r="3" fill="#94a3b8" />
  <!-- Inner Dial Circle -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <!-- Wheel spokes / vault dial marks -->
  <line x1="50" y1="26" x2="50" y2="32" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="68" x2="50" y2="74" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="50" x2="32" y2="50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <line x1="68" y1="50" x2="74" y2="50" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  <!-- Central Lock Eye -->
  <circle cx="50" cy="50" r="8" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#0f172a" />
</svg>
